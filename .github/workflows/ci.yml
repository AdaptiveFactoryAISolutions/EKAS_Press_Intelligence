name: Milestone 1 validation layers
permissions:
  contents: read
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  preservation:
    name: Upstream preservation
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with: {submodules: recursive, fetch-depth: 0}
      - run: bash scripts/verify_upstreams.sh
      - run: git diff --exit-code --submodule=diff -- vendor
      - run: test -z "$(git -C vendor/HistorianSim status --porcelain --untracked-files=normal)"
      - run: test -z "$(git -C vendor/HistorianRCA status --porcelain --untracked-files=normal)"
  upstream:
    name: HistorianSim pinned 173 tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with: {submodules: recursive, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: requirements-lock.txt}
      - run: python3 -m pip install -r requirements-lock.txt
      - run: python3 -m pip install --no-deps -e 'vendor/HistorianSim[dev]' -e '.[dev]'
      - run: bash scripts/run_upstream_baseline.sh
  ekas:
    name: EKAS ${{ matrix.layer }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        layer: [unit, simulation, contract, blind, observability, api, ui, browser]
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      EKAS_BROWSER_HEADLESS: '1'
    steps:
      - uses: actions/checkout@v4
        with: {submodules: recursive, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: requirements-lock.txt}
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - run: python3 -m pip install -r requirements-lock.txt
      - run: python3 -m pip install --no-deps -e 'vendor/HistorianSim[dev]' -e '.[dev]'
      - if: matrix.layer == 'browser'
        run: python3 -m playwright install --with-deps chromium
      - run: python3 scripts/test_layer.py ${{ matrix.layer }}
      - if: matrix.layer == 'simulation'
        run: python3 scripts/validate_campaign.py && python3 scripts/check_campaign.py
      - if: always() && matrix.layer == 'simulation'
        uses: actions/upload-artifact@v4
        with:
          name: full-duration-campaign
          path: validation/
