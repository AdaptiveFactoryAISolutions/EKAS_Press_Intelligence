[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ekas-press-intelligence-rca"
version = "0.1.0"
description = "Standalone EKAS press-line observability, RCA, sensor-gap and benchmark module"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.6,<3", "numpy>=1.24,<3"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27,<1", "playwright>=1.48,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
ekas_press_intelligence = ["ui/*.html", "ui/*.css", "ui/*.js"]
