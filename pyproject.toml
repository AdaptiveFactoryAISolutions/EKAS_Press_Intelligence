[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ekas-press-intelligence-rca"
version = "2.0.0.dev0"
description = "Standalone EKAS press-line observability, RCA, sensor-gap and benchmark module"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.6,<3", "numpy>=1.24,<3", "scipy>=1.10", "pandas>=1.5", "pyarrow>=11", "pyyaml>=6", "typer>=0.9", "matplotlib>=3.7", "httpx>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27,<1", "playwright>=1.48,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
ekas_press_intelligence = ["ui/*.html", "ui/*.css", "ui/*.js", "native_ui/*.html", "native_ui/*.css", "native_ui/*.js"]
